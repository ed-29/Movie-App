<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="top-nav" aria-label="Main navigation">
        <a class="site-brand" href="#" aria-label="Movie Finder home">Movie<span>Finder</span></a>
        <div class="search-area">
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Search for a movie..." aria-label="Search movies"
                    role="combobox" aria-autocomplete="list" aria-controls="search-suggestions"
                    aria-expanded="false" aria-activedescendant="">
                <button id="searchButton" type="button">Search</button>
            </div>
            <div id="search-suggestions" role="listbox" aria-label="Movie suggestions"></div>
        </div>
        <button id="theme-toggle" type="button">Dark Mode</button>
    </nav>
    <dialog id="movie-details" aria-labelledby="details-title">
        <button class="details-close" type="button" aria-label="Close movie details">&times;</button>
        <div id="movie-details-content"></div>
    </dialog>
    <div id="hero-container">
        <div id="hero-image">
                <div id="poster-track"></div>
        </div>
        <h1>The Movie You Want Is One Search Away</h1>
        <div id="results"></div>
    </div>
    <div id="filters">
        <ul>
            <li data-genre="all"> all    </li>
            <li data-genre="action"> action </li>
            <li data-genre="comedy"> comedy </li>   
            <li data-genre="drama"> drama  </li>    
            <li data-genre="horror"> horror </li>
            <li data-genre="romance"> romance</li>   
        </ul>
        
    </div>
    <div id="movie-display">
        <div class="movie-card">
            <!-- Movie cards will be dynamically inserted here -->
                <div class="movie-poster">
                    <img src="img/poster.jpg" alt="">
                </div>
                <div class="movie-info">
                    <div class="movie-title"><h3>title</h3></div>
                    <div class="movie-meta">
                        <div class="movie-rating">5 stars</div>
                        <div class="movie-discription">blah, blah, blah</div>
                        <div class="movie-genre">horror</div>
                        
                    </div>
                </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
