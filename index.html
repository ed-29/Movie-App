<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="hero-container">
        <button id="theme-toggle" type="button">
    Dark Mode
</button>
        <div id="hero-image">
                <div id="poster-track"></div>
        </div>
        <h1>The Movie You Want Is One Search Away</h1>
        
        <input type="text" id="searchInput" type="" placeholder="Search for a movie...">
        <button id="searchButton">Search</button>
        <div id="results"></div>
    </div>
    <div id="filters">
        <ul>
            <li> all    </li>
            <li> action </li>
            <li> comedy </li>   
            <li> drama  </li>    
            <li> horror </li>
            <li> romance</li>   
        </ul>
        
    </div>
    <div id="movie-display">
        <div class="movie-card">
            <!-- Movie cards will be dynamically inserted here -->
                <div class="movie-poster">
                    <img src="img/poster.jpg" alt="">
                </div>
                <div class="movie-info">
                    <div class="movie-title"><h3>title</h3></div>
                    <div class="movie-meta">
                        <div class="movie-rating">5 stars</div>
                        <div class="movie-discription">blah, blah, blah</div>
                        <div class="movie-genre">horror</div>
                        
                    </div>
                </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
