<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="hero-container">
        <div id="hero-image">
            <img src="https://images.unsplash.com/photo-1601758123927-0c3f9b1d2a8e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bW92aWV8ZW58MHx8MHx8&w=1000&q=80" alt="Movie Background">    
        </div>
        <h1>Movie Search App</h1>
        <input type="text" id="searchInput" placeholder="Search for a movie...">
        <button id="searchButton">Search</button>
        <div id="results"></div>
    </div>
    <div id="filters">
        <ul>
            <li> all    </li>
            <li> action </li>
            <li> comedy </li>   
            <li> drama  </li>    
            <li> horror </li>
            <li> romance</li>   
        </ul>
    </div>
    <div id="movie-display">
        <div id="movie-cards">
            <!-- Movie cards will be dynamically inserted here -->

        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
